<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="https://www.thymeleaf.org">

    <!-- initialize bootstrap for pretty UI elements -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- initialize the fancier bootstrap buttons and elements -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Head -->
    <head>
        <meta charset="UTF-8">
        <title>Search Results</title>
    </head>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg bg-body-tertiary rounded" aria-label="Eleventh navbar example">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">Placeholder Airlines</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarsExample09" aria-controls="navbarsExample09" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarsExample09">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="/flights">Flights</a>
                    </li>
                    <li class="nav-item" th:unless="${session.username}"><a class="nav-link" href="/login">Log In</a></li>
                    <li class="nav-item" th:if="${session.username}"><a class="nav-link" href="/logout">Log Out</a></li>
                    <li class="nav-item" th:unless="${session.username}"><a class="nav-link" href="/register">Register</a></li>
                </ul>
                <form role="search">
                    <input class="form-control" type="search" placeholder="Search" aria-label="Search">
                </form>
            </div>
        </div>
    </nav>

    <!-- Body -->
    <body class="bg-primary-subtle">


        <!-- Jumbotron header to grab attention: text, circle border, text header, subtitle, in that order. -->
        <div class="position-relative p-5 text-center text-muted bg-body border border-dashed rounded-5"
             style="background-image: url('/assets/photos/pexels-photograph-14158322.jpg');
                background-size: cover;
                background-position: right;">            <svg class="bi mt-5 mb-3" width="48" height="48" aria-hidden="true">
                <use xlink:href="#check2-circle"></use>
            </svg>
            <h1 class="text-body-emphasis">Search Results</h1>
            <p class="col-lg-6 mx-auto mb-4">
                Here's what we found for you.
            </p>
        </div>

        <!-- Results Card -->
        <div class="container mt-5">
            <div class="card shadow-lg p-4">
                <div class="card-body">
                    <h3>Available Flights</h3>

                    <!-- IF no flights, produce no results. Easy enough -->
                    <div th:if="${#lists.isEmpty(flights)}">
                        <p>No flights found for your search.</p>
                    </div>

                    <!-- Use some Thyme magic to scale our results based on relevant data. -->
                    <!-- Basically a FOR loop in HTML. that's so cool! -->
                    <div th:each="flight : ${flights}">
                        <div class="card shadow-lg mt-3">
                            <div class="card-body">
                                <h3 th:text="${flight.airline}"></h3>
                                <p>
                                    Flight Number <span th:text="${flight.flightNumber}"></span>
                                </p>
                                <p>
                                    <span th:text="${flight.departureDestination}"></span>
                                    to
                                    <span th:text="${flight.arrivalDestination}"></span>
                                </p>
                                <p>
                                    Departure Date: <span th:text="${flight.departureDate}"></span>
                                </p>
                                <p>
                                    Arrival Date: <span th:text="${flight.arrivalDate}"></span>
                                </p>
                                Price: $<span th:text="${flight.price}"></span>
                                <!-- Make sure only logged in users can click the book flight button -->
                                <div th:if="${session.username}">
                                    <form th:action="@{/book}" method="post" class="mt-3">
                                        <input type="hidden" name="flightId" th:value="${flight.idFlights}">
                                        <button type="submit" class="btn btn-primary">Book Now</button>
                                    </form>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
